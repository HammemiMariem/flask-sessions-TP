{% extends "layout.html" %}

{% block content %}
    <h1>Inscription</h1>
    <form action="/register" method="POST">
        <p><label><b> Nom : </b></label>
            <input placeholder="Votre nom" type="text" name="name" autofocus required></p>
        <p><label><b> Adresse e-mail : </b></label>
            <input placeholder="Votre e-mail" type="email" name="email" required></p>
        <p><label><b> Mot de passe : </b></label>
            <input placeholder="Votre mot de passe" type="password" name="password" required></p>
        <input type="submit" value="S'inscrire">
    </form>
    <p>Déjà inscrit(e) ? <a href="/login">Se connecter</a></p>
{% endblock %}
