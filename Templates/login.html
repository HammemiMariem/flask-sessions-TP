{% extends "layout.html" %}

{% block content %}
    <h1>Connexion</h1>
    <form action="/login" method="POST">
        <p><label><b> Adresse e-mail : </b></label>
            <input placeholder="Votre e-mail" type="email" name="email" autofocus required></p>
        <p><label><b> Mot de passe : </b></label>
            <input placeholder="Votre mot de passe" type="password" name="password" required></p>
        <input type="submit" value="Envoyer">
    </form>
    <p>Pas encore de compte ? <a href="/register">S'inscrire</a></p>
{% endblock %}
